# =================================================================
# Render.com Web Service Specification for Tiffin Management Platform
# Zero External Database Dependency - Uses Fast In-Memory & JSON Store
# =================================================================

services:
  - type: web
    name: tiffin-delivery-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
